<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DutySync 排班表</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="month-controls">
                <input type="month" id="month-picker" value="2026-07">
            </div>
        </header>

        <!-- 日曆標頭 (六、日加入 weekend-text 類別) -->
        <div class="calendar-header">
            <div class="weekend-text">日</div>
            <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div>
            <div class="weekend-text">六</div>
        </div>
        
        <!-- 排班網格生成區 -->
        <div id="calendar-grid" class="calendar-grid">
            <!-- JS 會自動在這裡產生日期與班表 -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
