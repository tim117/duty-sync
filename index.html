<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DutySync 排班表</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="month-controls">
                <input type="month" id="month-picker" value="2026-07">
            </div>
            <div class="instruction">💡 點擊日期格子即可手動調換班別</div>
        </header>

        <div class="calendar-header">
            <div class="weekend-text">日</div>
            <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div>
            <div class="weekend-text">六</div>
        </div>
        
        <div id="calendar-grid" class="calendar-grid">
            <!-- JS 生成區 -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
